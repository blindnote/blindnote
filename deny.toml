# cargo-deny configuration. Checked in CI on every push; see .github/workflows/ci.yml.

[graph]
# The release target plus the two machines this is developed on. A dependency
# that is sound on Linux and unsound on macOS still gets caught.
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"

[licenses]
version = 2
# Permissive only, plus MPL-2.0, whose reciprocity is per-file and does not
# reach our own sources. Anything copyleft beyond that would contradict the
# licence chosen for this project (CLAUDE.md section 10).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
# Our own crates carry license-file rather than an SPDX expression, because
# PolyForm Shield 1.0.0 has no SPDX identifier.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # TLS is terminated by Caddy, in its own container, and never in this
    # process (CLAUDE.md section 13). A TLS stack appearing in the dependency
    # graph means something started making outbound connections.
    { name = "native-tls" },
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
