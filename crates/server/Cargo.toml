[package]
name = "blindnote-server"
description = "HTTP server for BlindNote: one-time-read, end-to-end encrypted, self-destructing notes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "blindnote"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
blindnote-store = { workspace = true }
governor = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tower_governor = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# Already in the graph through axum; named here so the tests can speak HTTP
# over a real socket without adding a client library to the tree.
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
