name: reproducibility

# Rebuilds a released image from its source tag and checks it matches the
# published, signed one -- the "someone actually verifies" step of CLAUDE.md
# section 3, run in a clean CI environment rather than on a laptop. This is
# `verify.sh` in CI: it both checks the cosign identity and rebuilds for a digest
# match. Runs automatically after every release, and on demand for any tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify (e.g. v0.1.7)"
        required: true
  workflow_run:
    workflows: ["release"]
    types: [completed]

permissions:
  contents: read
  packages: read # pull the published image from GHCR (private while the repo is)

concurrency:
  group: reproducibility-${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    # A release run only gets checked if it succeeded; manual runs always proceed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history and tags, so verify.sh can check out the release tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the tag to verify
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          tag="${INPUT_TAG:-$RUN_TAG}"
          if [ -z "$tag" ]; then echo "no tag to verify" >&2; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "verifying $tag"

      # cosign and imagetools read the published image; while the repo is private
      # the GHCR package is too, so the job authenticates with its own token.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Same buildx (and thus BuildKit) version the release built with, so a digest
      # mismatch means a real reproducibility gap, not a tooling difference.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Checks both independent things: the signature's identity, and that the
      # rebuilt digest matches the published one.
      - name: Verify the release reproduces and is signed
        run: ./verify.sh "${{ steps.tag.outputs.tag }}"
