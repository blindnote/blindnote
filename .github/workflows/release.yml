# Build the image, push it to GHCR by digest, and sign it keyless with cosign.
# This is the trust chain from CLAUDE.md section 3 and section 9: published
# source -> reproducible build -> published artifact -> a signature the server's
# verify policy pins to THIS workflow's identity. The server pulls by digest and
# verifies; nothing authorized ever connects inward.
#
# Third-party actions are pinned to commit SHAs (supply-chain is the product).
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  IMAGE: ghcr.io/blindnote/blindnote

jobs:
  build-sign:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write        # push to GHCR
      id-token: write         # cosign keyless (OIDC)
      attestations: write     # provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reproducible timestamp from the tagged commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          # No metadata-action labels: they inject org.opencontainers.image.created
          # (the build time) into the config, which breaks bit-reproducibility. The
          # Dockerfile carries the deterministic labels; the git revision and version
          # live in the SLSA provenance attestation instead.
          provenance: mode=max
          sbom: true
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          outputs: type=image,push=true,rewrite-timestamp=true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Record the signed digest in the job summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Signed image"
            echo ""
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo ""
            echo "Verify with \`./verify.sh ${GITHUB_REF_NAME}\`."
          } >> "$GITHUB_STEP_SUMMARY"
