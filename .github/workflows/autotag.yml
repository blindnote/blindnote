# Auto-release on merge to master: tag the merge commit and dispatch the
# release build, so a merged PR goes live without a manual tag.
#
# The version is the latest tag bumped by one patch. The release build still
# runs from the TAG ref (via workflow_dispatch below), so its cosign keyless
# identity stays `release.yml@refs/tags/vX` and the server's verify policy
# (CLAUDE.md section 9) is unchanged -- every deploy is still a signed,
# verifiable, versioned release.
#
# Why this and not "release on push to master": a master-triggered build would
# sign as `@refs/heads/master`, which the server rejects. Dispatching release
# on the new tag keeps the tag-pinned identity, and GITHUB_TOKEN is allowed to
# trigger workflow_dispatch (unlike a tag push, which it cannot), so no PAT is
# needed.
#
# Put [skip deploy] in a commit message to skip a deploy.
name: autotag

on:
  push:
    branches: [master]
  # Lets a release be cut on demand from the current master (e.g. to test the
  # pipeline) without a dummy commit.
  workflow_dispatch:

permissions:
  contents: write   # create and push the version tag
  actions: write    # dispatch the release workflow

concurrency:
  group: autotag
  cancel-in-progress: false

jobs:
  tag:
    if: ${{ !contains(github.event.head_commit.message, '[skip deploy]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out with the full tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Unlike the read-only workflows, this one pushes a tag, so it keeps
          # the checkout token to authenticate the push.
          persist-credentials: true

      - name: Compute the next patch version
        id: ver
        run: |
          latest="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          latest="${latest:-v0.0.0}"
          v="${latest#v}"
          IFS=. read -r major minor patch <<< "$v"
          next="v${major}.${minor}.$((patch + 1))"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Releasing $next (previous tag: $latest)"

      - name: Tag the commit and dispatch the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          git tag "$NEXT"
          git push origin "$NEXT"
          # Dispatch the release build ON THE TAG, so cosign signs as
          # release.yml@refs/tags/$NEXT -- the identity the server pins. A tag
          # pushed by GITHUB_TOKEN does not trigger `on: push: tags`, which is
          # exactly why we dispatch instead.
          gh workflow run release.yml --ref "$NEXT"
          echo "Dispatched release for $NEXT"
