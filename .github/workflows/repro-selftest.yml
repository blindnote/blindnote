name: repro-selftest

# Determinism check that needs no release and no box: build the image from the
# current ref twice, independently (--no-cache), and compare the resulting amd64
# image-manifest digests. If they differ, the build is not reproducible and
# verify.sh can never pass -- so this is the fast loop for hardening the build
# before cutting a release. Mirrors verify.sh's raw `docker buildx build` (no
# metadata labels, no provenance), which is also what the release produces for
# the image manifest itself (provenance/SBOM are separate manifests, verified by
# cosign, not by this digest).

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  selftest:
    name: selftest
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Reproducible timestamp from HEAD
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build A
        run: |
          docker buildx build --no-cache \
            --build-arg "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" \
            --output "type=image,name=blindnote:a,rewrite-timestamp=true,push=false" \
            --metadata-file /tmp/a.json .

      - name: Build B
        run: |
          docker buildx build --no-cache \
            --build-arg "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" \
            --output "type=image,name=blindnote:b,rewrite-timestamp=true,push=false" \
            --metadata-file /tmp/b.json .

      - name: Compare the two image digests
        run: |
          a="$(python3 -c 'import json;print(json.load(open("/tmp/a.json"))["containerimage.digest"])')"
          b="$(python3 -c 'import json;print(json.load(open("/tmp/b.json"))["containerimage.digest"])')"
          echo "build A: $a"
          echo "build B: $b"
          if [ "$a" = "$b" ]; then
            echo "MATCH: the image build is deterministic."
          else
            echo "DIFFER: the build is not reproducible." >&2
            exit 1
          fi
