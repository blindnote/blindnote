[workspace]
members = ["crates/crypto", "crates/server", "crates/store"]
resolver = "3"

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.99"
license-file = "LICENSE.md"
repository = "https://github.com/blindnote/blindnote"
# Nothing here is published to crates.io. The artifact is a container image
# whose digest is signed; a crate release would be a second, unsigned channel.
publish = false

# Every version is exact. Dependency drift between a published artifact hash and
# a later rebuild is the one thing a reproducible build cannot tolerate.
[workspace.dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
blindnote-crypto = { path = "crates/crypto" }
# Build-time only: the client build is pre-compressed into the binary rather
# than compressed per request.
brotli = { version = "9.1.1", default-features = false, features = ["std"] }
sha2 = { version = "0.11.1", default-features = false, features = ["alloc"] }
blindnote-store = { path = "crates/store" }
# The kernel CSPRNG directly, with no userspace generator in front of it. A
# reseeding PRNG is state that would have to be kept, protected and zeroized,
# and at this call volume it buys nothing over asking the kernel.
getrandom = { version = "0.4.3", default-features = false }
http-body-util = { version = "0.1.5", default-features = false }
hyper = { version = "1.12.0", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
# Named only to spell out tower_governor's configuration type, which is
# generic over this crate's middleware and has no default for it.
governor = { version = "0.10.4", default-features = false, features = ["std"] }
# Bundled SQLite, so the build does not depend on whatever the host has, and
# the reproducible build has one fewer moving part. Default features are off to
# leave out the WebAssembly FFI backend.
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled", "cache"] }
# Already in the graph through tempfile, so naming it directly adds no crate.
# Used for one call: how many bytes are left on the data volume.
rustix = { version = "1.1.6", default-features = false, features = ["fs", "std"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
subtle = { version = "2.6.1", default-features = false }
tempfile = { version = "3.27.0", default-features = false }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5.3", default-features = false, features = ["limit"] }
# 0.6, matching axum 0.8.9's own requirement of ^0.6.8. Taking 0.7 would
# compile two copies of tower-http into the graph.
tower-http = { version = "0.6.11", default-features = false, features = ["catch-panic", "set-header", "timeout"] }
# Default features include tonic, which would drag a whole gRPC stack in for
# nothing.
tower_governor = { version = "0.8.0", default-features = false, features = ["axum", "tracing"] }
tracing = { version = "0.1.44", default-features = false, features = ["attributes", "std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }
zeroize = { version = "1.9.1", default-features = false }

[workspace.lints.rust]
# Stated twice on purpose: once here as the backstop, and once at the top of
# every crate root where a reader of the source can see it.
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
# "BlindNote" is a product name, not an identifier, and backticking it in prose
# would make every doc comment read like code.
doc_markdown = "allow"
todo = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
# Wrapping arithmetic in release is a silent bug class, and none of this binary's
# hot paths are arithmetic: the expensive work is AES in the client and fsync in
# SQLite.
overflow-checks = true
# Nothing reads symbols from the shipped binary: core dumps are off on the host
# (CLAUDE.md section 9.5), so there is no crash to symbolise.
strip = "symbols"
